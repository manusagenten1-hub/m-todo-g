<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método Glúteo 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --bg-color: #faf5ff;
            --card-bg: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border-color: #e9d5ff;
            --success: #8b5cf6;
            --shadow: 0 40px 80px -15px rgba(139, 92, 246, 0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius-lg: 40px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --zinc-400: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar */
        .progress-container {
            padding: 24px 24px 0;
        }
        
        .progress-text {
            font-size: 11px;
            color: var(--zinc-400);
            font-weight: 700;
            margin-bottom: 12px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
        }
        
        .progress-text::after {
            content: 'Progresso';
            color: var(--text-main);
        }

        .progress-track {
            height: 6px;
            background: var(--border-color);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.7s ease-out;
            border-radius: 9999px;
        }

        /* Screen Area */
        #screen-area {
            flex: 1;
            padding: 24px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .screen {
            display: none;
            flex-direction: column;
            animation: fadeSlideIn 0.5s forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.1;
            color: var(--text-main);
        }

        p {
            font-size: 16px;
            color: #27272a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        /* Components */
        
        /* Slider */
        .slider-container {
            margin: 24px 0;
            text-align: center;
        }

        .slider-value {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Options Cards */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .option-card {
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            background: #fff;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: var(--bg-color);
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: var(--bg-color);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
        }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 20px 24px;
            border-radius: var(--radius-md);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
            width: 100%;
            text-align: center;
            margin-top: 16px;
            box-shadow: 0 10px 15px -3px rgba(228, 228, 231, 0.5);
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: scale(0.98);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-large {
            font-size: 18px;
            padding: 22px 24px;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column-reverse;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-back {
            background: transparent;
            color: var(--zinc-400);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-back:hover {
            background: transparent;
            color: var(--text-muted);
        }

        /* Placeholders */
        .image-placeholder {
            width: 100%;
            height: 200px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.02);
            text-align: center;
            padding: 20px;
        }

        .image-placeholder.large {
            height: 300px;
        }

        /* Scratch Card */
        .scratch-container {
            position: relative;
            width: 100%;
            height: 180px;
            margin-bottom: 24px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .scratch-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .scratch-content.revealed {
            opacity: 1;
        }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }
        
        .success-anim {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Offer Page Elements */
        .check-list {
            list-style: none;
            margin-bottom: 24px;
        }
        
        .check-list li {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-main);
        }
        
        .check-list li::before {
            content: '✓';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            background: var(--success);
            color: white;
            border-radius: 50%;
            margin-right: 12px;
            margin-top: 2px;
            font-size: 14px;
        }
        
        .bonus-section {
            background: rgba(216, 180, 226, 0.1);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1px dashed var(--primary);
        }
        
        .bonus-section h3 {
            color: var(--primary-dark);
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .order-bump {
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .order-bump:hover {
            border-color: var(--primary);
        }
        
        .order-bump input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        
        .order-bump-info {
            flex: 1;
        }
        
        .order-bump-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        
        .order-bump-price {
            color: var(--success);
            font-weight: 700;
            font-size: 14px;
        }

        .price-display {
            text-align: center;
            margin: 32px 0;
        }
        
        .price-value {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-main);
        }
        
        .guarantee {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .custom-highlight {
            color: var(--primary-dark);
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <div class="progress-container">
            <div class="progress-text" id="progress-text">Etapa 1 de 13</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div id="screen-area">
            <!-- Screens will be rendered here by JS -->
        </div>
    </div>

    <script>
        const answers = {};
        let currentScreenIndex = 0;
        
        const screens = [
            {
                id: 'screen1',
                type: 'info',
                title: 'Descubra o plano ideal para conquistar um glúteo mais firme e definido em apenas 21 dias, dedicando apenas 15 minutos do seu dia.',
                smallTitle: true,
                centerTitle: true,
                images: ['https://i.ibb.co/qMwkcT20/Chat-GPT-Image-1-de-ago-de-2026-22-51-18-1.webp'],
                buttonText: 'Quero montar meu plano agora →',
                buttonHelpText: 'Leva menos de 1 minuto.',
                footerText: 'Ambiente seguro • Seus dados protegidos • Privacidade garantida'
            },
            {
                id: 'screen2',
                type: 'options',
                title: 'Qual resultado você mais gostaria de conquistar hoje?',
                text: 'Seja sincera, não existe resposta certa ou errada.',
                options: [
                    '🍑 Bumbum mais firme e definido',
                    '⬆️ Bumbum mais empinado e arredondado',
                    '⚖️ Bumbum mais proporcional ao corpo',
                    '✨ Quero tudo isso junto'
                ]
            },
            {
                id: 'screen3',
                type: 'options',
                title: 'Em qual momento você mais gostaria de perceber essa mudança?',
                text: 'Sabe aquele momento que você pensa: "Nossa, que diferença!"? Onde ele seria mais importante para você?',
                options: [
                    '🪞 Quando me olho no espelho depois do banho',
                    '👗 Quando visto aquela calça ou vestido que adoro',
                    '🏖️ Quando vou à praia ou piscina',
                    '🥰 No meu dia a dia, para me sentir mais confiante'
                ]
            },
            {
                id: 'screen4',
                type: 'options',
                title: 'Você já tentou algo para alcançar esse resultado?',
                text: 'Conta pra mim o que você já experimentou até agora.',
                options: [
                    '🏋️‍♀️ Treinos na academia (mas desanimei)',
                    '🏠 Exercícios em casa por conta própria',
                    '📱 Aulas e vídeos espalhados pela internet',
                    '🤷‍♀️ Ainda não encontrei um método que realmente funcionasse'
                ]
            },
            {
                id: 'screen5',
                type: 'options',
                title: 'O que mais te desanima quando você tenta alcançar esse resultado?',
                text: 'Muitas mulheres desistem no meio do caminho, e o motivo geralmente é um desses abaixo. Qual é o seu?',
                options: [
                    '😓 Treino, me esforço, mas quase não vejo diferença no espelho',
                    '😕 Não sei se estou fazendo os exercícios certos',
                    '⏳ Tenho muita dificuldade para manter uma rotina',
                    '🏃‍♀️ Minha rotina é muito corrida, falta tempo'
                ]
            },
            {
                id: 'screen6',
                type: 'options',
                title: 'Como funciona a sua rotina durante o dia?',
                text: 'Para que o plano seja real para você, preciso entender o seu dia a dia. Como é a maior parte do seu tempo?',
                options: [
                    '🪑 Passo a maior parte do dia sentada',
                    '🏃‍♀️ Estou sempre de um lado para o outro',
                    '⚖️ Um pouco dos dois, divido meu tempo'
                ]
            },
            {
                id: 'screen7',
                type: 'options',
                title: 'Um pequeno compromisso com você mesma',
                text: 'Se eu te dissesse que é possível ver resultados reais dedicando aproximadamente 15 minutos por dia, você conseguiria manter esse compromisso durante 21 dias?',
                options: [
                    '✅ Sim, consigo separar 15 minutos',
                    '💪 Com certeza, se der resultado eu dou um jeito',
                    '🤔 Acho que sim, mas precisaria me organizar'
                ]
            },
            {
                id: 'screen8',
                type: 'info',
                title: 'Você não está sozinha nessa.',
                images: [
                    'https://i.ibb.co/4w3dK8B1/Dia-1.webp',
                    'https://i.ibb.co/S76J2CJt/Dia-1-1.webp',
                    'https://i.ibb.co/nMTb6qHP/Chat-GPT-Image-1-de-ago-de-2026-22-51-18.webp'
                ],
                text: 'Além de mim, essas mulheres também achavam que o formato do bumbum nunca iria mudar.<br><br>Até descobrirem uma forma diferente de treinar.',
                buttonText: 'Continuar →'
            },
            {
                id: 'screen9',
                type: 'info',
                title: 'Talvez o problema nunca tenha sido falta de esforço.',
                text: 'Muitas vezes, colocamos a culpa na nossa disciplina, na nossa genética ou na nossa idade.<br><br>Mas a verdade é que fazer o exercício errado, ou treinar sem um método, gasta sua energia e não traz o resultado que você deseja.<br><br>Quando você segue um plano passo a passo, feito para o corpo da mulher, a transformação acontece.',
                buttonText: 'Quero conhecer meu plano personalizado →'
            },
            {
                id: 'screen10',
                type: 'scratch',
                title: 'Você chegou até aqui.',
                text: 'Separei um presente para quem concluiu todo o diagnóstico. <strong>Raspe para descobrir.</strong>',
                buttonText: 'Ver oferta →'
            },
            {
                id: 'screen11',
                type: 'info',
                title: 'Veja o tipo de resultado que você pode conquistar em apenas 21 dias.',
                images: ['https://i.ibb.co/zHT8q25y/Chat-GPT-Image-2-de-ago-de-2026-16-49-58.png'],
                smallImage: true,
                centerImages: true,
                text: 'Cada evolução começa com um primeiro passo.<br><br>Seu plano personalizado foi preparado para ajudar você a conquistar um glúteo mais firme, arredondado e definido, respeitando sua rotina e dedicando apenas 20 minutos por dia.',
                buttonText: 'Acessar meu plano personalizado →'
            },
            {
                id: 'screen12',
                type: 'offer',
                title: '🎉 Seu plano personalizado está pronto.',
                text: 'Com base nas suas respostas, o Método Glúteo 3D é o protocolo mais indicado para quem deseja conquistar um glúteo mais firme, arredondado e definido dedicando apenas 20 minutos por dia, em casa e sem equipamentos.',
                buttonText: 'Quero começar meu Método Glúteo 3D'
            }
        ];

        const appContainer = document.getElementById('screen-area');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');

        function initQuiz() {
            renderScreen(currentScreenIndex);
            updateProgress();
        }

        function updateProgress() {
            const total = screens.length;
            const current = currentScreenIndex + 1;
            progressText.textContent = `Etapa ${current} de ${total}`;
            const percentage = (current / total) * 100;
            progressFill.style.width = `${percentage}%`;
        }

        function nextScreen(answerValue = null) {
            const currentScreen = screens[currentScreenIndex];
            
            if (answerValue !== null) {
                saveAnswer(currentScreen.id, answerValue);
            }

            if (currentScreenIndex < screens.length - 1) {
                currentScreenIndex++;
                renderScreen(currentScreenIndex);
                updateProgress();
            } else {
                finishQuiz();
            }
        }

        function prevScreen() {
            if (currentScreenIndex > 0) {
                currentScreenIndex--;
                renderScreen(currentScreenIndex);
                updateProgress();
            }
        }

        function saveAnswer(screenId, value) {
            answers[screenId] = value;
        }

        function sendAnswers() {
            console.log("----- RESPOSTAS DO QUIZ -----");
            console.log(JSON.stringify(answers, null, 2));
            console.log("-----------------------------");
        }

        function finishQuiz() {
            sendAnswers();
            window.location.href = "https://pay.cakto.com.br/3d94qwn_924614";
        }

        function renderScreen(index) {
            const screenData = screens[index];
            appContainer.innerHTML = ''; 
            
            const screenEl = document.createElement('div');
            screenEl.className = 'screen active';
            
            if (screenData.title) {
                const title = document.createElement('h1');
                title.textContent = screenData.title;
                if (screenData.smallTitle) title.style.fontSize = '22px';
                if (screenData.centerTitle) title.style.textAlign = 'center';
                screenEl.appendChild(title);
            }

            if (screenData.imagePlaceholder) {
                const placeholder = document.createElement('div');
                placeholder.className = 'image-placeholder';
                placeholder.innerHTML = `<!-- Imagem: ${screenData.imagePlaceholder} --><br>INSERIR IMAGEM AQUI<br><small>${screenData.imagePlaceholder}</small>`;
                screenEl.appendChild(placeholder);
            }
            
            if (screenData.imagePlaceholderLarge) {
                const placeholder = document.createElement('div');
                placeholder.className = 'image-placeholder large';
                placeholder.innerHTML = `<!-- Imagem: ${screenData.imagePlaceholderLarge} --><br>INSERIR IMAGEM AQUI<br><small>${screenData.imagePlaceholderLarge}</small>`;
                screenEl.appendChild(placeholder);
            }

            if (screenData.images && screenData.images.length > 0) {
                const imgContainer = document.createElement('div');
                imgContainer.style.display = 'flex';
                imgContainer.style.flexDirection = 'column';
                imgContainer.style.gap = '16px';
                imgContainer.style.marginBottom = '24px';
                if (screenData.centerImages) imgContainer.style.alignItems = 'center';
                
                screenData.images.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.style.width = screenData.smallImage ? '70%' : '100%';
                    img.style.height = 'auto';
                    img.style.borderRadius = 'var(--radius-sm)';
                    img.style.display = 'block';
                    imgContainer.appendChild(img);
                });
                
                screenEl.appendChild(imgContainer);
            }

            if (screenData.text) {
                const text = document.createElement('p');
                text.innerHTML = screenData.text;
                screenEl.appendChild(text);
            }

            if (screenData.subText) {
                const subText = document.createElement('p');
                subText.innerHTML = screenData.subText;
                if (screenData.subTextCenter) {
                    subText.style.textAlign = 'center';
                }
                screenEl.appendChild(subText);
            }

            if (screenData.bottomText) {
                const bottomTextEl = document.createElement('h2');
                bottomTextEl.innerHTML = screenData.bottomText;
                bottomTextEl.style.fontSize = '24px';
                bottomTextEl.style.fontWeight = '800';
                bottomTextEl.style.color = 'var(--primary)';
                bottomTextEl.style.textAlign = 'center';
                bottomTextEl.style.marginTop = '8px';
                bottomTextEl.style.marginBottom = '24px';
                screenEl.appendChild(bottomTextEl);
            }

            if (screenData.type === 'slider') {
                renderSlider(screenEl, screenData);
            } else if (screenData.type === 'options') {
                renderOptions(screenEl, screenData);
            } else if (screenData.type === 'scratch') {
                renderScratchCard(screenEl);
            } else if (screenData.type === 'offer') {
                renderOffer(screenEl);
            }

            if (screenData.type !== 'options') {
                const navContainer = document.createElement('div');
                navContainer.className = 'nav-buttons';
                
                if (index > 0) {
                    const backBtn = document.createElement('button');
                    backBtn.className = 'btn-back';
                    backBtn.innerHTML = 'Voltar etapa anterior';
                    backBtn.onclick = prevScreen;
                    navContainer.appendChild(backBtn);
                }
                
                const nextBtn = document.createElement('button');
                nextBtn.className = `btn ${screenData.buttonClass || ''}`;
                nextBtn.textContent = screenData.buttonText || 'Continuar';
                nextBtn.onclick = () => {
                    if(screenData.type === 'slider') {
                        const val = screenEl.querySelector('input[type=range]').value;
                        nextScreen(val);
                    } else if (screenData.type === 'offer') {
                        finishQuiz();
                    } else {
                        nextScreen('Continuou');
                    }
                };
                navContainer.appendChild(nextBtn);
                
                if (screenData.buttonHelpText) {
                    const helpText = document.createElement('div');
                    helpText.textContent = screenData.buttonHelpText;
                    helpText.style.fontSize = '14px';
                    helpText.style.color = 'var(--text-muted)';
                    helpText.style.textAlign = 'center';
                    helpText.style.marginTop = '12px';
                    navContainer.appendChild(helpText);
                }

                if (screenData.footerText) {
                    const footerText = document.createElement('div');
                    footerText.textContent = screenData.footerText;
                    footerText.style.fontSize = '12px';
                    footerText.style.color = 'var(--text-muted)';
                    footerText.style.textAlign = 'center';
                    footerText.style.marginTop = '8px';
                    navContainer.appendChild(footerText);
                }
                
                screenEl.appendChild(navContainer);
            } else if (index > 0 && screenData.type === 'options') {
                 const navContainer = document.createElement('div');
                 navContainer.className = 'nav-buttons';

        function initScratchCanvas(canvas, hiddenContent) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            ctx.fillStyle = '#eaeaea';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#666';
            ctx.font = '16px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Raspe aqui para revelar', canvas.width/2, canvas.height/2);
            
            let isDrawing = false;
            let isRevealed = false;
            
            const startDraw = (e) => {
                isDrawing = true;
                scratch(e);
            };
            const endDraw = () => isDrawing = false;
            
            const scratch = (e) => {
                if (!isDrawing || isRevealed) return;
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const canvasRect = canvas.getBoundingClientRect();
                
                const x = clientX - canvasRect.left;
                const y = clientY - canvasRect.top;
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                checkScratchPercent();
            };
            
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', scratch);
            window.addEventListener('mouseup', endDraw);
            
            canvas.addEventListener('touchstart', startDraw, {passive: true});
            canvas.addEventListener('touchmove', scratch, {passive: true});
            window.addEventListener('touchend', endDraw);
            
            function checkScratchPercent() {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] === 0) transparentPixels++;
                }
                
                const totalPixels = pixels.length / 4;
                const percent = (transparentPixels / totalPixels) * 100;
                
                if (percent > 40 && !isRevealed) {
                    isRevealed = true;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    canvas.style.display = 'none';
                    hiddenContent.classList.add('revealed', 'success-anim');
                }
            }
        }
